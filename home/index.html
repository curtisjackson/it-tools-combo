<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tools</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e3e6eb;
      --text: #15181d;
      --muted: #687080;
      --focus: #3b82f6;
      --radius: 14px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #171a21;
        --border: #262b35;
        --text: #e8eaee;
        --muted: #8b93a3;
        --focus: #60a5fa;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 56px 16px 32px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
    .hint { color: var(--muted); font-size: 13px; }
    kbd {
      font: 12px ui-monospace, monospace;
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: var(--surface);
    }
    .search {
      width: 100%;
      margin: 24px 0 28px;
      padding: 14px 16px;
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
    }
    .search:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      color: inherit;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card:focus-visible, .card.active { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .title { display: flex; align-items: center; gap: 12px; }
    .badge {
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
    }
    .name { font-size: 17px; font-weight: 600; }
    .version { color: var(--muted); font: 12px ui-monospace, monospace; }
    .desc { margin: 0; color: var(--muted); flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 12px;
      padding: 1px 8px;
      border-radius: 999px;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .tag.hit { color: var(--text); border-color: var(--accent); }
    .empty { color: var(--muted); padding: 32px 0; text-align: center; }
    footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Tools</h1>
      <span class="hint"><kbd>/</kbd> поиск · <kbd>↑</kbd><kbd>↓</kbd> выбор · <kbd>Enter</kbd> открыть</span>
    </header>
    <input class="search" id="q" type="search" placeholder="Что нужно сделать? Например: jwt, base64, сжать картинку, pdf" autocomplete="off" autofocus>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Ничего не нашлось. Попробуйте открыть <a href="/it-tools/">IT-Tools</a> — там поиск по всем его утилитам.</p>
    <footer id="footer"></footer>
  </main>

  <script>
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const q = document.getElementById('q');
    let tools = [];
    let versions = {};
    let active = 0;
    let navigated = false;

    // Простые синонимы, чтобы искать по-русски.
    const synonyms = {
      'картин': 'image', 'изображ': 'image', 'фото': 'image', 'сжат': 'compress', 'размер': 'resize',
      'видео': 'video', 'аудио': 'audio', 'звук': 'audio', 'пдф': 'pdf', 'шифр': 'crypto', 'хэш': 'hash',
      'хеш': 'hash', 'пароль': 'password', 'декод': 'decode', 'кодир': 'encode', 'текст': 'text',
      'список': 'list', 'сеть': 'ip', 'подсеть': 'subnet', 'токен': 'token', 'дата': 'cron', 'время': 'cron'
    };

    function terms(query) {
      return query.toLowerCase().split(/\s+/).filter(Boolean).map((t) => {
        const ru = Object.keys(synonyms).find((k) => t.startsWith(k));
        return ru ? [t, synonyms[ru]] : [t];
      });
    }

    function matches(tool, query) {
      const hay = [tool.name, tool.description, ...tool.tags].join(' ').toLowerCase();
      return terms(query).every((variants) => variants.some((v) => hay.includes(v)));
    }

    function render() {
      const query = q.value.trim();
      const list = query ? tools.filter((t) => matches(t, query)) : tools;
      const flat = terms(query).flat();
      active = Math.min(active, Math.max(list.length - 1, 0));
      grid.replaceChildren(...list.map((t, i) => {
        const a = document.createElement('a');
        a.className = 'card' + ((query || navigated) && i === active ? ' active' : '');
        a.href = t.path;
        a.style.setProperty('--accent', t.color);
        const version = versions[t.id] ? `<span class="version">v${versions[t.id]}</span>` : '';
        a.innerHTML = `
          <div class="title">
            <span class="badge">${t.name[0]}</span>
            <div><div class="name"></div>${version}</div>
          </div>
          <p class="desc"></p>
          <div class="tags"></div>`;
        a.querySelector('.name').textContent = t.name;
        a.querySelector('.desc').textContent = t.description;
        a.querySelector('.tags').append(...t.tags.slice(0, 8).map((tag) => {
          const s = document.createElement('span');
          s.className = 'tag' + (flat.some((v) => tag.includes(v)) ? ' hit' : '');
          s.textContent = tag;
          return s;
        }));
        return a;
      }));
      empty.hidden = list.length > 0;
    }

    q.addEventListener('input', () => { active = 0; render(); });
    q.addEventListener('keydown', (e) => {
      const cards = grid.querySelectorAll('.card');
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        active = (active + (e.key === 'ArrowDown' ? 1 : -1) + cards.length) % Math.max(cards.length, 1);
        navigated = true;
        render();
      } else if (e.key === 'Enter' && cards[active]) {
        location.href = cards[active].href;
      } else if (e.key === 'Escape') {
        q.value = ''; navigated = false; render();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
    });

    Promise.all([
      fetch('tools.json').then((r) => r.json()),
      fetch('versions.json').then((r) => (r.ok ? r.json() : {})).catch(() => ({}))
    ]).then(([t, v]) => {
      tools = t;
      versions = v;
      document.getElementById('footer').innerHTML =
        'Исходники: ' + tools.map((x) => `<a href="${x.source}" rel="noopener">${x.name}</a>`).join(' · ') +
        ' · <a href="https://github.com/curtisjackson/it-tools-combo" rel="noopener">сборка</a>';
      render();
    });
  </script>
</body>
</html>
