name: build

on:
  pull_request:
  push:
    branches: [main]
  # Раз в неделю пересобираем, чтобы подтянуть исправления базовых образов nginx/node.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: it-tools-combo:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-тест
        run: |
          docker run -d --name combo --read-only --tmpfs /tmp -p 9449:8080 it-tools-combo:test
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:9449/healthz && break; sleep 1; done
          sh tests/smoke.sh http://127.0.0.1:9449

      - name: Логи контейнера
        if: failure()
        run: docker logs combo

      - name: Логин в GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация
        if: github.event_name != 'pull_request'
        run: |
          tag=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}
          for t in latest "$tag"; do
            docker tag it-tools-combo:test "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
