server {
    listen 8080;
    server_name _;
    root /srv/home;
    index index.html;

    # За прокси $scheme и порт не те, что видит браузер, — редиректы только относительные.
    absolute_redirect off;
    server_tokens off;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Без завершающего слэша относительные пути внутри приложений резолвятся не туда.
    location = /it-tools  { return 301 /it-tools/; }
    location = /cyberchef { return 301 /cyberchef/; }
    location = /omni      { return 301 /omni/; }

    # Стартовая страница.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }

    # it-tools: SPA. COOP/COEP нужны утилитам на WebAssembly (SharedArrayBuffer).
    location /it-tools/ {
        root /srv;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        # Неизвестные пути — маршруты SPA (у неё своя 404).
        try_files $uri /it-tools/index.html;
    }

    location /it-tools/assets/ {
        root /srv;
        # Сборка it-tools кладёт рядом .gz — отдаём их без сжатия на лету.
        gzip_static on;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # CyberChef: обычная статика.
    location /cyberchef/ {
        root /srv;
        try_files $uri $uri/ =404;
    }

    # Omni-Tools: SPA.
    location /omni/ {
        root /srv;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /omni/index.html;
    }

    location /omni/assets/ {
        root /srv;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
